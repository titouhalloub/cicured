packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  '@swc/core': true
  esbuild: true
  msgpackr-extract: true
  # dockerode -> ssh2 pulls these in. All three are explicitly DISALLOWED: their
  # install scripts either compile native code (cpu-features) or are pure
  # packaging no-ops (protobufjs, ssh2). M2a only talks to the local Docker
  # Unix socket, so the optional TCP transport is never used.
  cpu-features: false
  protobufjs: false
  ssh2: false
  tree-sitter-go: false
  tree-sitter-javascript: false
  tree-sitter-python: false
  tree-sitter-rust: false
  tree-sitter-typescript: false
minimumReleaseAgeExclude:
  - '@nestjs/common@12.1.1'
  - '@nestjs/core@12.1.1'
  - '@nestjs/platform-express@12.1.1'
  - '@nestjs/testing@12.1.1'
  - '@typescript-eslint/eslint-plugin@8.71.0'
  - '@typescript-eslint/parser@8.71.0'
  - '@typescript-eslint/project-service@8.71.0'
  - '@typescript-eslint/scope-manager@8.71.0'
  - '@typescript-eslint/tsconfig-utils@8.71.0'
  - '@typescript-eslint/type-utils@8.71.0'
  - '@typescript-eslint/types@8.71.0'
  - '@typescript-eslint/typescript-estree@8.71.0'
  - '@typescript-eslint/utils@8.71.0'
  - '@typescript-eslint/visitor-keys@8.71.0'
  - typescript-eslint@8.71.0